# ---- The fuser (a refinery module) ----
# Fuses two atoms into one heavier one: their atomic numbers add up (iron 26
# + iron 26 = tellurium 52). Mass is kept: kg in = kg out, the two taken in
# the ratio of their atomic masses. It keeps each element in `keep` topped
# up in the refined stockpile. Any pair that makes uranium (92) has a heavy
# partner, and every heavy element is rare, so when a partner is short it
# is fused first from common atoms (one step down). Of the ways to make
# something it takes the one the stockpile can make the most of. Energy
# isn't an economy yet, so for now this is near-endless uranium.
[fuser]
kg_per_s = 0.5               # kg of uranium a second (the steps before it on top): a sapper's 8 kg charge in 16 s
energy_per_kg = 250          # E per kg fused, every step: about 4,000 E a charge from iron and calcium
spare_energy = 2000          # only from energy above this (and the swarm's reserve): haulers and cutters come first
keep = { U = 16 }            # uranium kept in stock: two charges
fuse = [
  # Uranium (92):
  { make = "U", from = ["Te", "Zr"] },   # 52 + 40: from iron and calcium alone (below)
  { make = "U", from = ["Xe", "Sr"] },   # 54 + 38
  { make = "U", from = ["Ba", "Kr"] },   # 56 + 36: barium is the commonest heavy element
  { make = "U", from = ["Pb", "Ne"] },   # 82 + 10: lead
  { make = "U", from = ["Ta", "K"] },    # 73 + 19
  { make = "U", from = ["Hf", "Ca"] },   # 72 + 20
  # Partners, from common atoms:
  { make = "Te", from = ["Fe", "Fe"] },  # 26 + 26
  { make = "Zr", from = ["Ca", "Ca"] },  # 20 + 20
  { make = "Xe", from = ["Fe", "Ni"] },  # 26 + 28
  { make = "Sr", from = ["K", "K"] },    # 19 + 19
  { make = "Sr", from = ["Si", "Cr"] },  # 14 + 24
  { make = "Kr", from = ["Ca", "S"] },   # 20 + 16
  { make = "Ne", from = ["N", "Li"] },   # 7 + 3
  { make = "Ne", from = ["C", "Be"] },   # 6 + 4
]

# ---- What cutters and haulers are made of (economy on) ----
# Every element delivered to the mother swarm goes into its stockpile.
# Elements are made into parts (neural cores, servos, struts...), kept in a
# parts stock, and units are built from parts. Each part is a mix of
# components; each component lists the elements it can be made of, best
# first; x is the kg of that element that stands in for 1 kg of it (a worse
# stand-in takes more). Making takes the best on hand, then the next, so a
# world short of copper makes wiring from aluminium instead: slower, never
# stuck. A component with no list takes anything solid, most plentiful
# first. Every list ends with "*": anything solid, so no world can stall.
# `ahead`: parts are made ahead and kept in stock for this many of each unit.
# (Until fabricator ships exist, parts are made at once from the stockpile.)

# ---- recipes: generated by tools/recipes.py (edit the script, not these) ----
# Parts are made of components; each component's elements run rarest first,
# x being kg of that element per kg of component, rising by 0.5 for every
# tenfold more common it is in Earth's crust. "*" is anything solid in the
# stockpile, most plentiful first (never for fissile: nothing
# else will do). Units are built from parts.

[recipe]
ahead = { harvester = 100, hauler = 2 }

[[recipe.part]]
id = "neural-core"
name = "Neural core"
lore = "The drone's mind; every unit needs exactly one"
