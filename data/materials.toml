# What a wrecked drone leaves where it fell: scrap that can be mined again
# (Necromancers may one day raise it). A cell holds about one drone.

[[material]]
name = "drone-scrap"
state = "powder"
density = 100
hardness = 2
colour = [150, 160, 175]
multiplier = 1.0
composition = { Fe = 0.45, Al = 0.3, Si = 0.15, Cu = 0.1 }
melts_at_k = 950
melts_to = "molten drone-scrap"
latent_boil_k = 5000

# Melted scrap (a cell is one drone's worth, so it weighs what the scrap does
# and floats on lava as a thin film). It sets again well below its melting
# point, so scrap sitting on a lava flow, warmed from below and cooling to
# space above, doesn't flick between molten and solid every few ticks.
[[material]]
name = "molten drone-scrap"
state = "liquid"
density = 100
hardness = 0
colour = [255, 140, 70]
multiplier = 1.0
composition = { Fe = 0.45, Al = 0.3, Si = 0.15, Cu = 0.1 }
freezes_at_k = 850
freezes_to = "drone-scrap"
boils_at_k = 2700
latent_boil_k = 5000
flow = 0.6
conduct = 0.4

# Reactions between touching cells: overrides only. Most of what happens comes
# from heat and phase changes (water touching lava boils, and the lava crusts
# over) with no row written for it. Rows here are for tuning and the exotic;
# inputs and outputs must weigh the same. Example:
#   [[reaction]]
#   name = "..."
#   a = "magma"
#   b = "water"
#   a_to = "lava-rock"
#   b_to = "steam"
#   chance = 0.3
#   heat_k = -150

# Heat and motion in the sandbox.
[physics]
ticks_per_s = 10             # the sandbox steps with the logic tick
space_k = 200                # open space pulls hot cells toward 200 K...
radiate = 0.02               # ...by 2% of the difference per tick per open face, times twice the material's conduct
conduct = 0.02               # share of a temperature difference crossing between touching cells per tick
wake_gradient_k = 25         # a neighbour this far off starts tracking heat
settle_k = 0.05              # a cell that changed less than this, and did nothing else, sleeps
sunlight = 0.1               # a sunlit open face closes 10% of the gap to the Sun's warmth per tick
melt_margin_k = 100          # generated liquids start this far above freezing; depth holds melting points this far above the local heat

# Loose rigid bodies: chunks of rock cut free, and wrecked drones.
gravity_m_s2 = 3.0           # pull toward the centre on loose bodies (game value; real asteroids barely pull at all)
island_max_cells = 120       # solid rock cut off from everything, up to this many cells, breaks free and falls...
island_min_cells = 8         # ...if it has at least this many; smaller specks cling where they are
settle_s = 1.0               # a body still this long sets down into the ground
crush_speed_m_s = 6.0        # a body moving faster than this wrecks drones working where it passes (a fall of about 6 m)
lava_kill_k = 1000           # a drone working beside a liquid this hot (lava, molten metal) is in danger...
lava_kill_chance = 0.2       # ...and is wrecked one time in five; the rest get away

