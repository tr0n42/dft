# The Dark Forest Theory: material table.
# density is kg per cubic metre, which is also the mass of one 1 m cell.
# composition gives element mass fractions and must sum to 1.
# Phase changes (melts_to, freezes_to, boils_to, condenses_to) must go to a
# material of the same density: a cell keeps its mass whatever it becomes.
# multiplier is the processing bonus applied when the swarm refines this material.
# colour is the surface colour; underground cells draw darker.

