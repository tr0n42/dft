# ---- How they burn (see burning.toml). Living tissue is wet: slow to catch.
# Kelp and living crystal don't burn. ----

[[burn]]
material = "wood"
ignite_k = 600
flame_k = 1250
rate = 0.06

[[burn]]
material = "leaf"
ignite_k = 520
flame_k = 1100
rate = 0.5

[[burn]]
material = "bloom"
