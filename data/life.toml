# ---- The rules that breed each body's flora. ----
[life]
# The deepest a cave can hold life, below the surface (m).
depth_m = 1500
# Light reaches this deep into a sea; below it life needs chemistry.
sea_light_m = 200
# Caves this close under a living surface are fed by what seeps down.
seep_m = 600
# Ground this hot or hotter (K) counts as a hot spring or vent.
hot_k = 370
# Structural species bred per living niche, before the body's `life` scale.
species = [2, 5]
# Ground that counts as soil (roots grow in it; grass and forests on it).
soils = ["soil", "clay", "sand", "gravel", "volcanic ash", "humus", "leaf litter", "regolith", "red dust", "tholin"]

# Liquids life can use, with the temperatures (K) it can live at in each.
# A solvent counts on a body when any of its materials turns up there.
[[life.solvent]]
name = "water"
materials = ["water", "brine", "muddy water", "ice", "sea ice", "dirty ice", "aquifer sandstone"]
min_k = 245
max_k = 395

[[life.solvent]]
name = "ammonia"
materials = ["liquid ammonia", "ammonia ice"]
min_k = 190
max_k = 245
glamour = 0.4

[[life.solvent]]
name = "methane"
materials = ["liquid methane", "methane ice", "liquid ethane", "ethane ice"]
min_k = 85
max_k = 190
glamour = 0.5
