# Life: the plant materials, how they burn, and the rules that breed each
# body's flora (src/flora.rs).
#
# Each species on a body gets its own copies of these materials in its own
# colours (named "flora <n> <part>"), so they keep these physics but every
# species looks different. Everything eaten is just biomass and its elements.
#
# Living tissue is mostly water; a 1 m cell of foliage is mostly air, so its
# mass is low.

