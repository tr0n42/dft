# The Dark Forest Theory: geology rules (G2). Which ore forms where.
# Loaded together with the material tables (append-only: the [geology] table).
#
# hydrothermal: minerals carried by hot fluids out of a cooling pluton and laid
#   down in veins. zone is the stretch of a vein, as a fraction of the pluton's
#   halo (0 = at the magma, 1 = the far end), where the mineral forms. kind is
#   the pluton kind that makes it (felsic: granite-like; mafic: gabbro-like).
#   Real porphyry systems are zoned this way: copper and molybdenum close in,
#   lead, zinc and silver in the middle, gold, antimony and mercury far out.
# contact: rock baked by a pluton's heat within its aureole.
# skarn: what forms where a pluton touches carbonate rock.
# cumulate: what settles in stripes at the base of a mafic pluton.

[geology]
vein_gangue = "quartz crystal"
skarn_hosts = ["limestone", "marble"]
cumulate_nugget = "platinum nugget"
cumulate_nugget_chance = 0.004

