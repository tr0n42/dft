# accessory: pods of a mineral scattered through a host rock, wherever that
# rock is on any body. The ground is cut into squares grid_m across; in a
# share `chance` of them a pod sits, radius_m across, between depth_m below
# the surface (as generated). Pods never cross a square's edge.
[[geology.accessory]]       # zircon in granite and its sands (placers)
material = "zircon"
host = ["granite", "gneiss", "sand", "sandstone"]
grid_m = 60
chance = 0.06
radius_m = [1.5, 4]

[[geology.accessory]]       # thorium in granite
material = "thorite"
host = ["granite", "gneiss"]
grid_m = 80
chance = 0.03
radius_m = [1.5, 3.5]

[[geology.accessory]]       # roll-front uranium in sandstone, and in granite
material = "pitchblende"
host = ["sandstone", "aquifer sandstone", "granite"]
grid_m = 120
chance = 0.008
radius_m = [2, 6]

[[geology.accessory]]       # radon seeping from the uranium in granite
material = "radon gas"
host = ["granite"]
grid_m = 90
chance = 0.03
radius_m = [2, 5]
depth_m = [20, 5000]

[[geology.accessory]]       # helium and the noble gases, trapped in porous rock
material = "radiogenic gas"
host = ["sandstone", "aquifer sandstone", "limestone", "conglomerate", "tuff"]
grid_m = 150
chance = 0.04
radius_m = [4, 12]
depth_m = [40, 8000]

