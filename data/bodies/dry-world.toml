# Dry world: a cold desert planet (like Mars). Once it had rivers and lakes;
# now its water is frozen underground and in caps at the poles, under a sky
# too thin to hold it. Red dust over basalt, dry river gravels with gold in
# them, salt and gypsum from dried lakes, a canyon torn across it and giant
# volcanoes long gone quiet. No Heart.
name = "Dry world"
archetype = "dry-world"
seed = 22001
radius_m = 30000
heart = false
regolith_depth_m = 6
regolith_material = "red dust"
atmosphere_m = 1200
atmosphere_colour = [205, 150, 120]

# Cool days that never thaw the buried ice, bitter nights.
[sun]
day_k = 260
day_s = 900
start_deg = 0

[shape]
roughness = 0.008
wavelength_m = 7000

[[layer]]
name = "inner core"
outer = 0.2
material = "iron-nickel"
temperature_k = 2000
boundary_noise = 0.01

[[layer]]
name = "outer core"
outer = 0.5
material = "molten-iron"
temperature_k = 1900
boundary_noise = 0.015

[[layer]]
name = "mantle"
outer = 0.9
material = "peridotite"
temperature_k = 1400
boundary_noise = 0.02

[[layer]]
name = "crust"
outer = 1.0
material = "basalt"
temperature_k = 210

# Lava flows and the sediments of a wetter age: river sands and gravels,
# lake clays, salt and gypsum where the lakes dried up, iron-oxide crusts.
[strata]
depth_m = 1500
fold_amplitude_m = 50
fold_wavelength_m = 6000
pinch = 0.5
pinch_wavelength_m = 2500

[[strata.band]]
material = "basalt"
thickness_m = [20, 90]
weight = 4

[[strata.band]]
material = "sandstone"
thickness_m = [10, 50]
weight = 3

[[strata.band]]
material = "clay"
thickness_m = [4, 20]
weight = 1.5

[[strata.band]]
material = "conglomerate"
thickness_m = [3, 12]
weight = 1

[[strata.band]]
material = "volcanic ash"
thickness_m = [3, 15]
weight = 1

[[strata.band]]
material = "gypsum"
thickness_m = [2, 8]
weight = 0.5

[[strata.band]]
material = "hematite"
thickness_m = [1, 3]
weight = 0.3

[[strata.lens]]             # dry riverbeds: gravel with gold at the base
host = "conglomerate"
material = "gravel"
position = "base"
length_m = [80, 300]
thickness = 0.6
spacing_m = 500
nugget = "gold"
nugget_chance = 0.0004

[[strata.lens]]             # dried-up lakes: salt in the clay
host = "clay"
material = "rock salt"
position = "top"
length_m = [100, 400]
thickness = 0.5
spacing_m = 800

[[strata.lens]]             # frozen aquifers: ice filling the sands
host = "sandstone"
material = "dirty ice"
position = "middle"
length_m = [100, 500]
thickness = 0.5
spacing_m = 600

# The old cratered crust under it all, worn flat before the flows came.
[strata.old]
cover_m = [400, 1200]
cover_wavelength_m = 8000
erode_m = 600
conglomerate = "impact breccia"
conglomerate_m = [5, 20]
depth_m = 2500
fold_amplitude_m = 300
fold_wavelength_m = 3000
pinch = 0.4
pinch_wavelength_m = 3000

[[strata.old.band]]
material = "basalt"
thickness_m = [30, 100]
weight = 3

[[strata.old.band]]
material = "impact breccia"
thickness_m = [20, 80]
weight = 2

[[strata.old.band]]
material = "schist"
thickness_m = [20, 80]
weight = 1

[faults]
count = 30
throw_m = [20, 200]
length_m = 3000
dip = 0.3
gouge = "impact breccia"
gouge_width_m = 3
scarp = 0.5

[[cave]]                # lava tubes under the volcanoes' flanks
kind = "tube"
host = ["basalt"]
scale_m = 150
threshold = 0.9
max_depth_m = 800

[[intrusion]]           # gabbro bodies with nickel-copper sulfide and platinum at the base
material = "gabbro"
kind = "mafic"
count = 30
radius_m = [200, 600]
top_depth_m = [1200, 4000]
dikes = [1, 3]
veins = [6, 12]
halo_m = 400
aureole_m = 25

[[blob]]                # ground ice
material = "dirty ice"
count = 200
radius_min_m = 10
radius_max_m = 60
r_min = 0.97
r_max = 0.996

[[blob]]                # the last warm magma, deep under the volcanoes
material = "magma"
count = 12
radius_min_m = 200
radius_max_m = 800
r_min = 0.8
r_max = 0.9

[ice_caps]
material = "dirty ice"
thickness_m = 500
from_latitude = 0.9

[craters]
count = 30
radius_min_m = 50
radius_max_m = 2800
rim = 0.05
breccia = 0.2
melt = 0.02

[[deep.streaks]]
host = ["peridotite"]
r_min = 0.5
r_max = 0.89
cells = 8
bands = 9
width = 0.3
fraction = 0.35
warp = 0.4

[[deep.streaks.rock]]
material = "harzburgite"
weight = 2

[[deep.streaks.rock]]
material = "pyroxenite"
weight = 1

[[deep.plume]]          # old plumes under the giant volcanoes, mostly cooled
count = 2
base = 0.5
top = 0.85
stem_m = [1500, 2500]
head_m = [3000, 5000]
material = "plume rock"
melt = "magma"
melt_share = 0.1
heat_k = 150

[deep.inner_core]
host = "iron-nickel"
grain_m = 400
alt = "iron crystal"
precious = "platinum-iron alloy"
precious_centre = 0.3
precious_edge = 0.02
boundary_m = 6

# ---- surface ----
[[relief]]              # giant shield volcanoes over the plumes, nearly all dead
kind = "hotspot"
chance = 1.0
width_m = [5000, 9000]
height_m = [2000, 4500]
extra = 0.12
band_m = [16, 50]
active_chance = 0.15

[[relief.material]]
material = "basalt"
weight = 6

[[relief.material]]
material = "volcanic ash"
weight = 1

[[relief]]              # the smooth northern lowlands
kind = "lowland"
chance = 0.8
width_m = [6000, 6000]
height_m = [1000, 2500]
fill_m = 200

[[relief.material]]
material = "sandstone"

[[relief]]              # a great canyon where the crust split open
kind = "rift"
chance = 0.9
width_m = [2000, 4000]
height_m = [1500, 3500]
fill_m = 150

[[relief.material]]
material = "conglomerate"

[[relief]]              # dunes of red dust
kind = "boulders"
count = [100, 200]
width_m = [20, 60]
height_m = [0, 0]
extra = 0.82

[[relief.material]]
material = "red dust"
