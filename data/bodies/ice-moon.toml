# Ice moon: a moon of a giant planet (like Europa), its rock and metal wrapped
# in a deep salty ocean under a cracked shell of ice. Breach the shell and the
# ocean comes up the hole, pushed by the weight of the ice, to nine tenths
# of the way to the surface. No Heart.
name = "Ice moon"
archetype = "ice-moon"
seed = 12001
radius_m = 10000
heart = false
regolith_depth_m = 2
regolith_material = "sea ice"
atmosphere_m = 0
atmosphere_colour = [0, 0, 0]

[shape]
roughness = 0.002
wavelength_m = 5000

[[layer]]
name = "iron core"
outer = 0.35
material = "iron-nickel"
temperature_k = 1400

[[layer]]
name = "rock mantle"
outer = 0.80
material = "peridotite"
temperature_k = 900

[[layer]]
name = "ocean"
outer = 0.93
material = "brine"
temperature_k = 262

[[layer]]
name = "ice shell"
outer = 1.0
material = "ice"
temperature_k = 100

# Cracks where the ocean welled up and froze: bands of salty ice, and the
# salts left behind at the surface, stained by radiation.
[[vein]]
material = "sea ice"
host = ["ice"]
scale_m = 500
width = 0.05
r_min = 0.93
r_max = 1.0

[[vein]]
material = "rock salt"
host = ["ice", "sea ice"]
scale_m = 700
width = 0.015
r_min = 0.985
r_max = 1.0

# Pockets of brine trapped in the shell ("lakes" inside the ice).
[[blob]]
material = "brine"
count = 60
radius_min_m = 15
radius_max_m = 60
r_min = 0.95
r_max = 0.985

# Hydrothermal vents on the ocean floor build mounds of minerals.
[[blob]]
material = "chalcopyrite"
count = 60
radius_min_m = 10
radius_max_m = 40
r_min = 0.79
r_max = 0.81

[[blob]]
material = "pyrite"
count = 60
radius_min_m = 10
radius_max_m = 40
r_min = 0.79
r_max = 0.81

[[deep.streaks]]
host = ["ice"]
r_min = 0.935
r_max = 0.99
cells = 16
bands = 7
width = 0.35
fraction = 0.4
warp = 0.5

[[deep.streaks.rock]]
material = "sea ice"
weight = 2

[[deep.streaks.rock]]
material = "dirty ice"
weight = 1

[deep.inner_core]
host = "iron-nickel"
grain_m = 600
alt = "iron crystal"
precious = "platinum-iron alloy"
precious_centre = 0.3
precious_edge = 0.02
boundary_m = 25

[craters]
count = 8
radius_min_m = 40
radius_max_m = 400
breccia = 0.1
breccia_material = "sea ice"
melt = 0.0
rim = 0.03

# ---- surface (G5) ----
[[relief]]              # double ridges along the cracks
kind = "range"
chance = 1.0
count = [3, 6]
width_m = [150, 400]
height_m = [60, 200]

[[relief]]              # chaos terrain: blocks of shell broken up and refrozen
kind = "boulders"
count = [300, 500]
width_m = [8, 40]
height_m = [0, 0]
extra = 0.5

[[relief.material]]
material = "ice"
weight = 3

[[relief.material]]
material = "sea ice"
weight = 2

[[relief]]              # plumes: brine erupting through the shell
kind = "volcano"
chance = 0.7
count = [1, 2]
width_m = [300, 800]
height_m = [60, 200]
steep = true
extra = 0.1
band_m = [2, 6]
melt = "brine"
chamber = "sea ice"
dike = "sea ice"
active_chance = 0.6

[[relief.material]]
material = "sea ice"
weight = 3

[[relief.material]]
material = "rock salt"
weight = 1
