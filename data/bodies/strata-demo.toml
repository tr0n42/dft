# G1 demo: a small rocky body whose crust is a folded, faulted stack of
# sediments and lava flows over granite. No veins or caves, so the layering
# is easy to see.
name = "Geology demo"
archetype = "rocky-world"
seed = 7001
radius_m = 2000
heart = false
regolith_depth_m = 1.5
regolith_material = "soil"
atmosphere_m = 0
atmosphere_colour = [0, 0, 0]
polar_cooling_k = 60
polar_depth_m = 80

[shape]
roughness = 0.012
wavelength_m = 700

[[layer]]
name = "inner core"
outer = 0.1
material = "iron-nickel"
temperature_k = 2400
boundary_noise = 0.02

[[layer]]
name = "outer core"
outer = 0.2
material = "molten-iron"
temperature_k = 2100
boundary_noise = 0.03

[[layer]]
name = "lower mantle"
outer = 0.4
material = "perovskite rock"
temperature_k = 1800
boundary_noise = 0.035

[[layer]]
name = "transition zone"
outer = 0.48
material = "ringwoodite rock"
temperature_k = 1600
boundary_noise = 0.04

[[layer]]
name = "upper mantle"
outer = 0.75
material = "peridotite"
temperature_k = 1400
boundary_noise = 0.03

[[layer]]
name = "crust"
outer = 1.0
material = "gneiss"
temperature_k = 290

[strata]
depth_m = 350
fold_amplitude_m = 60
fold_wavelength_m = 1200
pinch = 0.55
pinch_wavelength_m = 500

[[strata.band]]
material = "sandstone"
thickness_m = [6, 25]
weight = 3

[[strata.band]]
material = "shale"
thickness_m = [4, 18]
weight = 3

[[strata.band]]
material = "limestone"
thickness_m = [8, 30]
weight = 2

[[strata.band]]
material = "conglomerate"
thickness_m = [3, 10]
weight = 1

[[strata.band]]
material = "coal"
thickness_m = [1, 3]
weight = 0.6

[[strata.band]]
material = "basalt"
thickness_m = [5, 15]
weight = 0.8

[[strata.band]]
material = "tuff"
thickness_m = [3, 8]
weight = 0.6

[[strata.band]]
material = "banded iron"
thickness_m = [4, 12]
weight = 0.4

[[strata.lens]]             # old river channels: gravel with gold at the base
host = "conglomerate"
material = "gravel"
position = "base"
length_m = [60, 220]
thickness = 0.6
spacing_m = 350
nugget = "gold"
nugget_chance = 0.0005

[[strata.lens]]             # evaporated lagoons: salt inside shale
host = "shale"
material = "rock salt"
position = "middle"
length_m = [80, 300]
thickness = 0.5
spacing_m = 900

[[strata.lens]]             # salt at the top of lagoon limestones
host = "limestone"
material = "rock salt"
position = "top"
length_m = [60, 200]
thickness = 0.4
spacing_m = 700

[[strata.lens]]
host = "limestone"
material = "gypsum"
position = "top"
length_m = [50, 200]
thickness = 0.4
spacing_m = 700

[strata.old]             # an older era: folded hard, worn flat, buried by the layers above
cover_m = [60, 170]          # depth of the worn surface (an unconformity)
cover_wavelength_m = 700
erode_m = 150                # worn down into its folds before burial
conglomerate = "conglomerate"
conglomerate_m = [1.5, 5]    # gravel left on the worn surface
depth_m = 420
fold_amplitude_m = 230
fold_wavelength_m = 220
pinch = 0.3
pinch_wavelength_m = 400

[[strata.old.band]]
material = "quartzite"
thickness_m = [5, 18]
weight = 3

[[strata.old.band]]
material = "slate"
thickness_m = [4, 14]
weight = 3

[[strata.old.band]]
material = "marble"
thickness_m = [3, 12]
weight = 2

[[strata.old.band]]
material = "schist"
thickness_m = [4, 16]
weight = 2

[[strata.old.band]]
material = "banded iron"
thickness_m = [1, 4]
weight = 1

[[cave]]                    # dissolved passages in carbonate rock
kind = "karst"
host = ["limestone", "marble"]
scale_m = 35
threshold = 0.88
max_depth_m = 300

[[cave]]                    # drained lava tubes in lava flows
kind = "tube"
host = ["basalt"]
scale_m = 60
threshold = 0.9
max_depth_m = 300

[ice_caps]
material = "ice"
thickness_m = 45
from_latitude = 0.8

[faults]
count = 10
throw_m = [4, 40]
length_m = 500
dip = 0.3
gouge = "gravel"
gouge_width_m = 1.5
scarp = 0.6           # share of each throw left standing as a cliff

[craters]
count = 3
radius_min_m = 40
radius_max_m = 160
rim = 0.05
breccia = 0.25
melt = 0.05

[[intrusion]]               # granite plutons with porphyry-style ore
material = "granite"
kind = "felsic"
count = 3
radius_m = [120, 220]
top_depth_m = [40, 140]
dikes = [2, 4]
dike_material = "andesite"
dike_width_m = [2, 5]
veins = [14, 24]
vein_width_m = [1, 3]
halo_m = 260
aureole_m = 30
skarn_m = 10

[[intrusion]]               # a gabbro body with chromite at its base
material = "gabbro"
kind = "mafic"
count = 1
radius_m = [150, 200]
top_depth_m = [120, 200]
dikes = [1, 3]
veins = [6, 10]
halo_m = 180
aureole_m = 20

# ---- deep interior ----
[[deep.streaks]]        # "marble cake": old crust stirred into the mantle
host = ["peridotite", "ringwoodite rock", "perovskite rock"]
r_min = 0.2
r_max = 0.74
cells = 6
bands = 9
width = 0.3
fraction = 0.4
warp = 0.4

[[deep.streaks.rock]]
material = "harzburgite"
weight = 3

[[deep.streaks.rock]]
material = "pyroxenite"
weight = 2

[[deep.streaks.rock]]
material = "eclogite"
weight = 1

[[deep.plume]]          # hot plumes rising from the core
count = 2
base = 0.21
top = 0.66
stem_m = [66, 120]
head_m = [200, 319]
material = "plume rock"
melt = "magma"
melt_share = 0.25
heat_k = 250

[[deep.slab]]           # cold old crust sinking from the surface
count = 2
thickness_m = 80
bottom = 0.26
material = "eclogite"
stall_chance = 0.5
stall_at = 0.45
chill_k = 400
diamond = "diamond"
diamond_chance = 0.004

[deep.piles]            # dense piles resting on the core
count = 2
at = 0.2
width = [0.12, 0.22]
height_m = [53, 120]
material = "deep pile rock"
melt = "magma"
melt_m = 11

[deep.inner_core]       # radiating iron crystals, precious alloy on their boundaries
host = "iron-nickel"
grain_m = 26
alt = "iron crystal"
precious = "platinum-iron alloy"
precious_centre = 0.5
precious_edge = 0.02
boundary_m = 1.6

[deep.outer_core]       # convection columns along the spin axis
host = "molten-iron"
material = "sulfur-rich core melt"
column_m = 32
share = 0.3
top_material = "sulfur-rich core melt"
top_m = 11

