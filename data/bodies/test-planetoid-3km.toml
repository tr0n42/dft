# Test planetoid (3 km): a small layered body for testing dig difficulty.
# A crust of stacked lava flows and ash beds over basalt, cut by faults and
# lava tubes; magma chambers; small granite stocks with zoned ore veins in the
# crust; gabbro bodies in the mantle with chromite and platinum at their base;
# a molten iron core around a solid one.
name = "Test planetoid (3 km)"
archetype = "active-planetoid"
seed = 4001
radius_m = 1500
heart = false
regolith_depth_m = 5
atmosphere_m = 0
atmosphere_colour = [0, 0, 0]

[shape]
roughness = 0.02
wavelength_m = 500

[[layer]]
name = "inner core"
outer = 0.12
material = "iron-nickel"
temperature_k = 2600
boundary_noise = 0.02

[[layer]]
name = "outer core"
outer = 0.24
material = "molten-iron"
temperature_k = 2200
boundary_noise = 0.03

[[layer]]
name = "lower mantle"
outer = 0.42
material = "perovskite rock"
temperature_k = 1900
boundary_noise = 0.035

[[layer]]
name = "transition zone"
outer = 0.52
material = "ringwoodite rock"
temperature_k = 1700
boundary_noise = 0.04

[[layer]]
name = "upper mantle"
outer = 0.8
material = "peridotite"
temperature_k = 1500
boundary_noise = 0.03

[[layer]]
name = "crust"
outer = 1.0
material = "basalt"
temperature_k = 320

[strata]                # lava flows and ash beds, gently folded
depth_m = 200
fold_amplitude_m = 15
fold_wavelength_m = 700
pinch = 0.45
pinch_wavelength_m = 300

[[strata.band]]
material = "basalt"
thickness_m = [8, 30]
weight = 5

[[strata.band]]
material = "tuff"
thickness_m = [3, 10]
weight = 2

[[strata.band]]
material = "andesite"
thickness_m = [6, 20]
weight = 1.5

[[strata.band]]
material = "obsidian"
thickness_m = [1, 3]
weight = 0.3

[faults]
count = 6
throw_m = [3, 25]
length_m = 260
dip = 0.25
gouge = "impact breccia"
gouge_width_m = 1.2
scarp = 0.6           # share of each throw left standing as a cliff

[[cave]]                # drained lava tubes in the flows
kind = "tube"
host = ["basalt"]
scale_m = 45
threshold = 0.9
max_depth_m = 250

[[intrusion]]           # small granite stocks: gold, copper, lead-zinc veins
material = "granite"
kind = "felsic"
count = 14
radius_m = [35, 75]
top_depth_m = [150, 260]
dikes = [1, 3]
dike_material = "andesite"
veins = [24, 40]
vein_width_m = [1.5, 3.5]
halo_m = 210
aureole_m = 12
skarn_m = 6

[[intrusion]]           # gabbro bodies in the mantle: chromite and platinum at the base
material = "gabbro"
kind = "mafic"
count = 12
radius_m = [60, 130]
top_depth_m = [350, 800]
dikes = [1, 2]
veins = [4, 8]
halo_m = 120
aureole_m = 10

[[blob]]                # magma chambers
material = "magma"
count = 14
radius_min_m = 25
radius_max_m = 110
r_min = 0.5
r_max = 0.9

[[blob]]                # sulfur pockets: soft and close to the surface
material = "sulfur"
count = 25
radius_min_m = 8
radius_max_m = 30
r_min = 0.9
r_max = 1.0

[[sprinkle]]
material = "gold"
host = ["gold-quartz"]
chance = 0.0002
r_min = 0.0
r_max = 1.0

[[sprinkle]]
material = "diamond"
host = ["kimberlite"]
chance = 0.004
r_min = 0.0
r_max = 1.0

[pipes]                 # kimberlite pipes from the mantle
material = "kimberlite"
count = 2
width_m = 15
r_min = 0.45

[craters]
count = 4
radius_min_m = 40
radius_max_m = 200
rim = 0.05
breccia = 0.2
melt = 0.04

# ---- deep interior ----
[[deep.streaks]]        # "marble cake": old crust stirred into the mantle
host = ["peridotite", "ringwoodite rock", "perovskite rock"]
r_min = 0.24
r_max = 0.8
cells = 6
bands = 9
width = 0.3
fraction = 0.4
warp = 0.4

[[deep.streaks.rock]]
material = "harzburgite"
weight = 3

[[deep.streaks.rock]]
material = "pyroxenite"
weight = 2

[[deep.streaks.rock]]
material = "eclogite"
weight = 1

[[deep.plume]]          # hot plumes rising from the core
count = 2
base = 0.25
top = 0.7
stem_m = [50, 90]
head_m = [150, 240]
material = "plume rock"
melt = "magma"
melt_share = 0.25
heat_k = 250

[[deep.slab]]           # cold old crust sinking from the surface
count = 2
thickness_m = 60
bottom = 0.3
material = "eclogite"
stall_chance = 0.5
stall_at = 0.47
chill_k = 400
diamond = "diamond"
diamond_chance = 0.004

[deep.piles]            # dense piles resting on the core
count = 2
at = 0.24
width = [0.12, 0.22]
height_m = [40, 90]
material = "deep pile rock"
melt = "magma"
melt_m = 8

[deep.inner_core]       # radiating iron crystals, precious alloy on their boundaries
host = "iron-nickel"
grain_m = 20
alt = "iron crystal"
precious = "platinum-iron alloy"
precious_centre = 0.5
precious_edge = 0.02
boundary_m = 1.6

[deep.outer_core]       # convection columns along the spin axis
host = "molten-iron"
material = "sulfur-rich core melt"
column_m = 25
share = 0.3
top_material = "sulfur-rich core melt"
top_m = 8

