# Iron world: a small, dense planet close to its star (like Mercury). A
# giant iron core most of the way out, solid inside and molten around it,
# under a thin rocky mantle and a dark crust spotted with graphite. Long
# scorching days and freezing nights; cliffs where the planet shrank as its
# core cooled; old craters everywhere. No Heart.
name = "Iron world"
archetype = "iron-world"
seed = 9001
radius_m = 30000
heart = false
regolith_depth_m = 5
atmosphere_m = 0
atmosphere_colour = [0, 0, 0]

# A long day and a hot one: bare ground in full sun reaches 700 K.
[sun]
day_k = 700
day_s = 1800
start_deg = 0

[shape]
roughness = 0.003
wavelength_m = 9000

[[layer]]
name = "inner core"
outer = 0.45
material = "iron-nickel"
temperature_k = 1900

[[layer]]
name = "outer core"
outer = 0.83
material = "molten-iron"
temperature_k = 1800

[[layer]]
name = "iron sulfide layer"
outer = 0.85
material = "troilite"
temperature_k = 1300

[[layer]]
name = "mantle"
outer = 0.96
material = "peridotite"
temperature_k = 900

[[layer]]
name = "crust"
outer = 1.0
material = "gabbro"
temperature_k = 440

# Old lava plains and impact debris built the crust in layers; graphite
# (from the first crust, which floated on the magma ocean) darkens it.
[strata]
depth_m = 1000
fold_amplitude_m = 40
fold_wavelength_m = 8000
pinch = 0.5
pinch_wavelength_m = 4000

[[strata.band]]
material = "basalt"
thickness_m = [20, 80]
weight = 5

[[strata.band]]
material = "impact breccia"
thickness_m = [10, 50]
weight = 3

[[strata.band]]
material = "graphite"
thickness_m = [3, 15]
weight = 1.2

[[strata.band]]
material = "gabbro"
thickness_m = [20, 60]
weight = 2

[[strata.band]]
material = "obsidian"
thickness_m = [2, 8]
weight = 0.6

# "Hollows": bright pits where something volatile (sulfur) boiled out of the
# rock; pockets of it remain under the surface.
[[blob]]
material = "sulfur"
count = 220
radius_min_m = 10
radius_max_m = 60
r_min = 0.97
r_max = 0.998

[[blob]]
material = "graphite"
count = 300
radius_min_m = 8
radius_max_m = 50
r_min = 0.95
r_max = 0.995

[[vein]]
material = "chromite"
host = ["peridotite", "gabbro"]
scale_m = 600
width = 0.02
r_min = 0.85
r_max = 1.0

[[sprinkle]]
material = "platinum nugget"
host = ["iron-nickel", "troilite"]
chance = 0.001
r_min = 0.0
r_max = 0.86

# Faults where the planet shrank: the surface pushed up into long cliffs.
[faults]
count = 14
throw_m = [100, 900]
length_m = 6000
dip = 0.4
gouge = "impact breccia"
gouge_width_m = 6
scarp = 0.8

[deep.inner_core]
host = "iron-nickel"
grain_m = 1800
alt = "iron crystal"
precious = "platinum-iron alloy"
precious_centre = 0.3
precious_edge = 0.02
boundary_m = 60

[deep.outer_core]
host = "molten-iron"
material = "sulfur-rich core melt"
column_m = 1500
share = 0.3
top_material = "sulfur-rich core melt"
top_m = 400

[craters]
count = 90
radius_min_m = 60
radius_max_m = 2500
breccia = 0.18
melt = 0.04
rim = 0.05

# ---- surface (G5) ----
[[relief]]              # vast smooth lava plains filling an ancient basin
kind = "lowland"
chance = 0.6
width_m = [6000, 12000]
height_m = [300, 800]
fill_m = 500

[[relief.material]]
material = "basalt"

[[relief]]              # great impact basins
kind = "basin"
chance = 0.9
count = [1, 3]
width_m = [4000, 9000]
height_m = [500, 1500]
extra = 300
fill_m = 200

[[relief.material]]
material = "basalt"
