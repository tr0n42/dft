# Sulfur world: a small moon squeezed and heated by the tides of a giant
# planet (like Io). The most volcanic body there is: a silicate crust riddled
# with magma, lava lakes in open pits, layer on layer of sulfur and sulfur
# flows, all under a frost of sulfur dioxide that the Sun turns to gas.
# No Heart.
name = "Sulfur world"
archetype = "sulfur-world"
seed = 8001
radius_m = 25000
heart = false
regolith_depth_m = 4
regolith_material = "volcanic ash"
atmosphere_m = 400
atmosphere_colour = [120, 110, 60]

# A long day: frost on the day side warms past 198 K and turns to gas.
[sun]
day_k = 215
day_s = 900
start_deg = 0

[shape]
roughness = 0.006
wavelength_m = 9000

[[layer]]
name = "iron core"
outer = 0.35
material = "molten-iron"
temperature_k = 1900

[[layer]]
name = "hot mantle"
outer = 0.88
material = "peridotite"
temperature_k = 1500

[[layer]]
name = "crust"
outer = 1.0
material = "basalt"
temperature_k = 130

# The crust is built of flows: lava, sulfur, frost, ash, laid down over and
# over and pushed down by what came after.
[strata]
depth_m = 1800
fold_amplitude_m = 60
fold_wavelength_m = 6000
pinch = 0.6
pinch_wavelength_m = 2500

[[strata.band]]
material = "basalt"
thickness_m = [20, 90]
weight = 5

[[strata.band]]
material = "sulfur"
thickness_m = [8, 40]
weight = 4

[[strata.band]]
material = "sulfur dioxide frost"
thickness_m = [3, 15]
weight = 2

[[strata.band]]
material = "tuff"
thickness_m = [6, 25]
weight = 1.5

[[strata.band]]
material = "lava-rock"
thickness_m = [10, 40]
weight = 1.5

[[strata.band]]
material = "pyrite"
thickness_m = [1, 4]
weight = 0.4

# Magma everywhere under the surface, and pockets of molten sulfur.
[[blob]]
material = "magma"
count = 260
radius_min_m = 60
radius_max_m = 400
r_min = 0.86
r_max = 0.985

[[blob]]
material = "sulfur"
count = 300
radius_min_m = 20
radius_max_m = 120
r_min = 0.92
r_max = 0.995

[[vein]]
material = "pyrite"
host = ["basalt", "lava-rock"]
scale_m = 300
width = 0.03
r_min = 0.88
r_max = 1.0

[[sprinkle]]
material = "gold"
host = ["pyrite"]
chance = 0.0001
r_min = 0.85
r_max = 1.0

# Magma rising from the mantle feeds the crust's chambers.
[[deep.plume]]
count = 8
base = 0.4
top = 0.86
stem_m = [1200, 2400]
head_m = [1800, 3500]
material = "plume rock"
melt = "magma"
melt_share = 0.35
heat_k = 250

[[deep.streaks]]
host = ["peridotite"]
r_min = 0.36
r_max = 0.87
cells = 10
bands = 10
width = 0.3
fraction = 0.4
warp = 0.4

[[deep.streaks.rock]]
material = "harzburgite"
weight = 2

[[deep.streaks.rock]]
material = "magma"
weight = 1

[craters]
count = 0
radius_min_m = 10
radius_max_m = 10

# ---- surface (G5) ----
[[relief]]              # shield volcanoes and fissure vents over the plumes
kind = "hotspot"
chance = 1.0
width_m = [2500, 6000]
height_m = [300, 1200]
extra = 0.18
band_m = [10, 30]
active_chance = 0.8

[[relief.material]]
material = "basalt"
weight = 3

[[relief.material]]
material = "sulfur"
weight = 2

[[relief.material]]
material = "lava-rock"
weight = 1

[[relief]]              # paterae: pits with lava lakes in them
kind = "basin"
chance = 1.0
count = [3, 6]
width_m = [600, 1800]
height_m = [150, 400]
extra = 30
fill_m = 60
crust_m = 4             # sealed under a crust of cooled lava until broken into

[[relief.material]]
material = "magma"

[[relief]]              # great blocks of crust thrust up into mountains
kind = "range"
chance = 0.8
count = [1, 3]
width_m = [3000, 7000]
height_m = [1500, 4500]
