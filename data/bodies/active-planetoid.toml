# Active planetoid: the first body with a Heart. Small, young and restless.
# G4 geology: a folded, faulted stack of lava flows and ash over the basalt
# crust, lava tubes, granite stocks with zoned ore, gabbro bodies with
# platinum reefs in the mantle, magma chambers, gas and sulfur near vents.
name = "Active planetoid"
archetype = "active-planetoid"
seed = 2002
radius_m = 30000
heart = true
regolith_depth_m = 4
atmosphere_m = 1800
atmosphere_colour = [190, 160, 70]   # thin sulfurous haze

[shape]
roughness = 0.012
wavelength_m = 6000

[[layer]]
name = "inner core"
outer = 0.18
material = "iron-nickel"
temperature_k = 2600
boundary_noise = 0.01

[[layer]]
name = "outer core"
outer = 0.32
material = "molten-iron"
temperature_k = 2200
boundary_noise = 0.012

[[layer]]
name = "lower mantle"
outer = 0.55
material = "perovskite rock"
temperature_k = 2000
boundary_noise = 0.03

[[layer]]
name = "transition zone"
outer = 0.64
material = "ringwoodite rock"
temperature_k = 1750
boundary_noise = 0.03

[[layer]]
name = "upper mantle"
outer = 0.86
material = "peridotite"
temperature_k = 1500
boundary_noise = 0.02

[[layer]]
name = "crust"
outer = 1.0
material = "basalt"
temperature_k = 320

[strata]                # stacked lava flows, ash beds and glassy layers
depth_m = 1200
fold_amplitude_m = 80
fold_wavelength_m = 4000
pinch = 0.45
pinch_wavelength_m = 1500

[[strata.band]]
material = "basalt"
thickness_m = [20, 90]
weight = 5

[[strata.band]]
material = "tuff"
thickness_m = [8, 30]
weight = 2

[[strata.band]]
material = "andesite"
thickness_m = [15, 60]
weight = 1.5

[[strata.band]]
material = "obsidian"
thickness_m = [2, 6]
weight = 0.3

[faults]
count = 40
throw_m = [10, 120]
length_m = 2500
dip = 0.25
gouge = "impact breccia"
gouge_width_m = 2.5
scarp = 0.6           # share of each throw left standing as a cliff

[strata.old]             # an ancient greenstone belt: folded hard, worn flat, buried by younger lava
cover_m = [300, 900]
cover_wavelength_m = 6000
erode_m = 1200
conglomerate = "conglomerate"
conglomerate_m = [4, 15]
depth_m = 3600
fold_amplitude_m = 1500
fold_wavelength_m = 1500
pinch = 0.3
pinch_wavelength_m = 3000

[[strata.old.band]]
material = "schist"
thickness_m = [30, 120]
weight = 3

[[strata.old.band]]
material = "slate"
thickness_m = [20, 80]
weight = 2

[[strata.old.band]]
material = "basalt"
thickness_m = [20, 90]
weight = 2

[[strata.old.band]]
material = "quartzite"
thickness_m = [15, 60]
weight = 1

[[strata.old.band]]
material = "banded iron"
thickness_m = [5, 25]
weight = 1

[[cave]]                # lava tubes in the flows
kind = "tube"
host = ["basalt"]
scale_m = 150
threshold = 0.89
max_depth_m = 1500

[[intrusion]]           # granite stocks in the crust: zoned copper, lead-zinc and gold veins
material = "granite"
kind = "felsic"
count = 60
radius_m = [150, 400]
top_depth_m = [700, 1600]
dikes = [2, 4]
dike_material = "andesite"
veins = [30, 50]
vein_width_m = [2, 5]
halo_m = 900
aureole_m = 40
skarn_m = 15

[[intrusion]]           # gabbro bodies in the mantle: chromite and platinum reefs at the base
material = "gabbro"
kind = "mafic"
count = 80
radius_m = [300, 800]
top_depth_m = [4500, 15000]
dikes = [1, 3]
veins = [6, 12]
halo_m = 500
aureole_m = 30

[[blob]]                # magma chambers
material = "magma"
count = 45
radius_min_m = 200
radius_max_m = 1400
r_min = 0.74
r_max = 0.96

[[blob]]                # pressurised gas pockets
material = "volcanic-gas"
count = 140
radius_min_m = 15
radius_max_m = 120
r_min = 0.86
r_max = 0.99

[[blob]]                # sulfur deposits near vents
material = "sulfur"
count = 70
radius_min_m = 20
radius_max_m = 150
r_min = 0.94
r_max = 1.0

[[sprinkle]]
material = "gold"
host = ["gold-quartz"]
chance = 0.0002
r_min = 0.0
r_max = 1.0

[[sprinkle]]
material = "diamond"
host = ["kimberlite"]
chance = 0.004
r_min = 0.0
r_max = 1.0

[pipes]                 # kimberlite pipes: vertical diamond shafts from the mantle
material = "kimberlite"
count = 9
width_m = 70
r_min = 0.55

[craters]
count = 14
radius_min_m = 100
radius_max_m = 2200
rim = 0.05
breccia = 0.2
melt = 0.04

# ---- deep interior ----
[[deep.streaks]]        # "marble cake": old crust stirred into the mantle
host = ["peridotite", "ringwoodite rock", "perovskite rock"]
r_min = 0.32
r_max = 0.86
cells = 8
bands = 9
width = 0.3
fraction = 0.4
warp = 0.4

[[deep.streaks.rock]]
material = "harzburgite"
weight = 3

[[deep.streaks.rock]]
material = "pyroxenite"
weight = 2

[[deep.streaks.rock]]
material = "eclogite"
weight = 1

[[deep.plume]]          # hot plumes rising from the core
count = 3
base = 0.33
top = 0.78
stem_m = [1000, 1800]
head_m = [3000, 4800]
material = "plume rock"
melt = "magma"
melt_share = 0.25
heat_k = 250

[[deep.slab]]           # cold old crust sinking from the surface
count = 3
thickness_m = 1200
bottom = 0.36
material = "eclogite"
stall_chance = 0.5
stall_at = 0.6
chill_k = 400
diamond = "diamond"
diamond_chance = 0.004

[deep.piles]            # dense piles resting on the core
count = 2
at = 0.32
width = [0.12, 0.22]
height_m = [800, 1800]
material = "deep pile rock"
melt = "magma"
melt_m = 160

[deep.inner_core]       # radiating iron crystals, precious alloy on their boundaries
host = "iron-nickel"
grain_m = 300
alt = "iron crystal"
precious = "platinum-iron alloy"
precious_centre = 0.35
precious_edge = 0.02
boundary_m = 4

[deep.outer_core]       # convection columns along the spin axis
host = "molten-iron"
material = "sulfur-rich core melt"
column_m = 450
share = 0.3
top_material = "sulfur-rich core melt"
top_m = 160

