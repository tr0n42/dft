# Carbon world: a planet that formed where carbon outweighed oxygen. Its
# rock is silicon carbide and graphite instead of silicate; tar and oil seep
# through the crust; and under the weight of the layers above, graphite turns
# to diamond: the deeper, the more, down to a layer of solid diamond. No Heart.
name = "Carbon world"
archetype = "carbon-world"
seed = 10001
radius_m = 20000
heart = false
regolith_depth_m = 4
regolith_material = "graphite"
atmosphere_m = 0
atmosphere_colour = [0, 0, 0]

[sun]
day_k = 420
day_s = 1200
start_deg = 0

[shape]
roughness = 0.006
wavelength_m = 7000

[[layer]]
name = "iron core"
outer = 0.30
material = "iron-nickel"
temperature_k = 2400

[[layer]]
name = "carbide mantle"
outer = 0.55
material = "silicon carbide"
temperature_k = 1800

[[layer]]
name = "diamond layer"
outer = 0.62
material = "diamond"
temperature_k = 1500

[[layer]]
name = "graphite mantle"
outer = 0.90
material = "graphite"
temperature_k = 1000

[[layer]]
name = "crust"
outer = 1.0
material = "silicon carbide"
temperature_k = 330

# Layered crust: carbide, graphite, tar sands, coal, with oil and gas trapped
# in folds.
[strata]
depth_m = 1200
fold_amplitude_m = 90
fold_wavelength_m = 5000
pinch = 0.5
pinch_wavelength_m = 2500

[[strata.band]]
material = "silicon carbide"
thickness_m = [20, 80]
weight = 4

[[strata.band]]
material = "graphite"
thickness_m = [10, 50]
weight = 4

[[strata.band]]
material = "coal"
thickness_m = [3, 15]
weight = 1.5

[[strata.band]]
material = "sandstone"     # tar sands
thickness_m = [5, 25]
weight = 1

[[strata.lens]]            # tar soaked into the sands
host = "sandstone"
material = "tar"
position = "middle"
length_m = [80, 400]
thickness = 0.6
spacing_m = 600

[[strata.lens]]            # oil pooled under the coal
host = "coal"
material = "crude oil"
position = "base"
length_m = [60, 300]
thickness = 0.4
spacing_m = 900

[[blob]]
material = "carbon monoxide"   # gas pockets
count = 120
radius_min_m = 8
radius_max_m = 40
r_min = 0.92
r_max = 0.99

[[blob]]
material = "diamond"           # diamond bodies in the deep graphite
count = 400
radius_min_m = 10
radius_max_m = 60
r_min = 0.62
r_max = 0.75

# Graphite turns to diamond under pressure: more of it the deeper you go.
[[sprinkle]]
material = "diamond"
host = ["graphite"]
chance = 0.06
r_min = 0.62
r_max = 0.70

[[sprinkle]]
material = "diamond"
host = ["graphite"]
chance = 0.02
r_min = 0.70
r_max = 0.80

[[sprinkle]]
material = "diamond"
host = ["graphite"]
chance = 0.005
r_min = 0.80
r_max = 0.90

# Pipes that blasted up from the diamond layer, carrying diamond with them.
[pipes]
material = "kimberlite"
count = 10
width_m = 60
r_min = 0.6

[[deep.streaks]]
host = ["silicon carbide"]
r_min = 0.31
r_max = 0.54
cells = 8
bands = 10
width = 0.3
fraction = 0.35
warp = 0.4

[[deep.streaks.rock]]
material = "graphite"
weight = 2

[[deep.streaks.rock]]
material = "diamond"
weight = 1

[deep.inner_core]
host = "iron-nickel"
grain_m = 1200
alt = "iron crystal"
precious = "platinum-iron alloy"
precious_centre = 0.3
precious_edge = 0.02
boundary_m = 40

[craters]
count = 40
radius_min_m = 50
radius_max_m = 1500
breccia = 0.15
melt = 0.0
rim = 0.05

# ---- surface (G5) ----
[[relief]]              # tar lakes in low ground
kind = "basin"
chance = 1.0
count = [2, 5]
width_m = [500, 1500]
height_m = [80, 250]
extra = 10
fill_m = 70

[[relief.material]]
material = "tar"

[[relief]]              # graphite hills
kind = "range"
chance = 0.8
count = [1, 3]
width_m = [2500, 5000]
height_m = [400, 1200]

[[relief]]              # carbide boulders
kind = "boulders"
count = [400, 700]
width_m = [3, 15]
height_m = [0, 0]
extra = 0.35

[[relief.material]]
material = "silicon carbide"
weight = 3

[[relief.material]]
material = "graphite"
weight = 2
