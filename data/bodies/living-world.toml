# Living world: a world like Earth, the canvas for life (none yet: plants,
# animals and structures come later as their own layers). One great ocean
# and one great continent. Continents of granite under thick sediments;
# ocean floor of basalt; plates diving under the land at trenches, with
# volcanic arcs behind them; groundwater in the sands, oil and coal, salt,
# caves in the limestone, and an ancient crust under it all.
name = "Living world"
archetype = "living-world"
seed = 24001
radius_m = 35000
heart = false
regolith_depth_m = 3
regolith_material = "soil"
regolith_max_slope = 0.6        # steep slopes are bare rock
atmosphere_m = 3000
atmosphere_colour = [110, 160, 230]
oxygen = 0.21                  # breathable air: things can burn in it
# The air holds the warmth: nights stay as mild as the ground, the seas never freeze.
space_k = 288
polar_cooling_k = 30
polar_depth_m = 150

[sun]
day_k = 300
day_s = 900
start_deg = 0

[shape]
roughness = 0.003
wavelength_m = 8000

[[layer]]
name = "inner core"
outer = 0.19
material = "iron-nickel"
temperature_k = 2600
boundary_noise = 0.01

[[layer]]
name = "outer core"
outer = 0.45
material = "molten-iron"
temperature_k = 2300
boundary_noise = 0.012

[[layer]]
name = "lower mantle"
outer = 0.7
material = "perovskite rock"
temperature_k = 2000
boundary_noise = 0.02

[[layer]]
name = "transition zone"
outer = 0.78
material = "ringwoodite rock"
temperature_k = 1750
boundary_noise = 0.02

[[layer]]
name = "upper mantle"
outer = 0.9
material = "peridotite"
temperature_k = 1500
boundary_noise = 0.02

[[layer]]
name = "crust"
outer = 1.0
material = "granite"
temperature_k = 288

# Sediments laid down by rivers, deltas and shallow seas.
