# The Dark Forest Theory: element table.
# Every element from hydrogen to radium except the lanthanides, plus thorium
# and uranium (the two actinides that matter: radioactivity, heat, helium).
# The ground truth for procedural chemistry. Every material's composition is
# written in these elements, and rules about mixing, alloys, burning and
# melting read these properties.
#
# mass:        atomic mass (g/mol)
# radius_pm:   metallic radius for metals, covalent radius for the rest (picometres)
# structure:   crystal structure of the pure solid: fcc, bcc, hcp, diamond, molecular, noble, other
# en:          Pauling electronegativity (0 for noble gases)
# valence:     usual valence
# melt_k, boil_k: melting and boiling points of the pure element at 1 atm (kelvin)
# oxide:       its usual oxide, and that oxide's formation enthalpy per mole of
#              oxygen atoms (kJ/mol; more negative = more stable; 0 = no stable oxide)
# value:       game value of 1 kg of the pure element, in units of 1 kg of common rock
# class:       metal, metalloid, nonmetal, noble

