# The Dark Forest Theory: planet specialties.
#
# Every body rolls a few of these from its seed, so two worlds of the same
# kind differ in what they are worth: a vein of something rare far richer
# than usual, a trace element spread all through its rock, a whole mining
# district that is rich in some metals and poor in others, or (rarely) a
# jackpot lode. Each riffs on a real deposit, named in `riff`; the numbers are
# the game's, not nature's.
#
# A specialty only rolls on a body that could hold what it needs (`needs`, or
# by default the materials it boosts, enriches or lodes in).
#
#   boost   material -> multiplier on how often it forms (its vein, cumulate,
#           skarn and accessory weights); under 1 cuts it.
#   enrich  the element is put into those materials at a share (by mass)
#           picked from the range; the rest of the material scales down.
#   lode    `count` big pods of the material, `radius_m` across, in the
#           listed host rock (or any solid ground with any_solid) between
#           r = [r_min, r_max] of the body's radius.
#   jackpot rolled separately and rarely (see [roll]).

[roll]
count_odds = [0.08, 0.5, 0.3, 0.12]   # chance of 0, 1, 2, 3 specialties
jackpot_chance = 0.08                 # chance a body also holds one jackpot

# Asteroids and comets are pit stops: small, quick to strip, and more often
# than not holding a big chunk of one thing (their caches, below).
[[roll.by_archetype]]
archetype = ["rubble-asteroid", "metal-asteroid", "comet"]
count_odds = [0.05, 0.45, 0.4, 0.1]
jackpot_chance = 0.35

