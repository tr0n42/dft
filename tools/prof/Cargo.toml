[package]
name = "dft-prof"
version = "0.1.0"
edition = "2024"
publish = false

# A sampling profiler for the simulation (Windows): runs the big-swarm bench
# and, every millisecond, pauses the simulation's thread, walks its stack and
# counts where it is. Its own workspace, so the game's and the sim's builds
# and lock files are untouched.
[workspace]

[dependencies]
dft-sim = { path = "../.." }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
